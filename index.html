<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>JARVIS EYE GUARD</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at center,#083444,#02080d 65%);
  color:#dffaff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.app{
  width:min(900px,94%);
  padding:20px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.logo{
  color:#73eaff;
  font-size:25px;
  font-weight:bold;
  letter-spacing:5px;
  text-shadow:0 0 25px #16c7ee;
}

.sub{
  color:#577985;
  font-size:9px;
  letter-spacing:3px;
  margin-top:7px;
}

.panel{
  background:rgba(3,18,25,.88);
  border:1px solid rgba(80,220,255,.2);
  border-radius:20px;
  padding:18px;
  box-shadow:
    0 0 50px rgba(0,180,255,.12),
    inset 0 1px rgba(255,255,255,.04);
}

.camera{
  position:relative;
  width:100%;
  max-width:700px;
  margin:auto;
  overflow:hidden;
  border-radius:16px;
  background:#000;
  border:1px solid rgba(80,220,255,.25);
}

video{
  display:block;
  width:100%;
  transform:scaleX(-1);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.status{
  text-align:center;
  margin:18px 0;
  font-size:18px;
  font-weight:bold;
  color:#6df0ae;
  text-shadow:0 0 15px currentColor;
}

.status.warning{
  color:#ffd45c;
}

.status.danger{
  color:#ff5966;
  animation:blink .5s infinite alternate;
}

@keyframes blink{
  from{opacity:.4}
  to{opacity:1}
}

.info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.box{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(90,220,255,.1);
  border-radius:12px;
  padding:13px;
  text-align:center;
}

.box span{
  display:block;
  color:#587580;
  font-size:8px;
  letter-spacing:2px;
  margin-bottom:6px;
}

.box b{
  color:#8cecff;
  font-size:14px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button{
  flex:1;
  padding:13px;
  border-radius:11px;
  border:1px solid #247d91;
  background:#08242e;
  color:#73e7ff;
  font-size:10px;
  letter-spacing:1px;
}

button:active{
  transform:scale(.97);
}

.stop{
  color:#ff9ba3;
  border-color:#743b43;
  background:#211417;
}

.note{
  text-align:center;
  margin-top:14px;
  color:#52707a;
  font-size:9px;
  line-height:1.6;
}

@media(max-width:550px){
  .info{
    grid-template-columns:1fr;
  }

  .logo{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">JARVIS EYE GUARD</div>
    <div class="sub">REAL-TIME EYE MONITORING SYSTEM</div>
  </div>

  <div class="panel">

    <div class="camera">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <canvas id="canvas"></canvas>

    </div>

    <div
      id="status"
      class="status">
      SYSTEM OFFLINE
    </div>

    <div class="info">

      <div class="box">
        <span>EYE STATE</span>
        <b id="eyeState">---</b>
      </div>

      <div class="box">
        <span>CLOSED TIME</span>
        <b id="closedTime">0.0 s</b>
      </div>

      <div class="box">
        <span>SIREN</span>
        <b id="sirenState">OFF</b>
      </div>

    </div>

    <div class="buttons">

      <button onclick="startSystem()">
        👁 START EYE GUARD
      </button>

      <button
        class="stop"
        onclick="stopSystem()">
        ■ STOP
      </button>

    </div>

    <div class="note">
      Eyes open → SYSTEM OK<br>
      Eyes continuously closed → warning → siren
    </div>

  </div>

</div>


<!-- MediaPipe -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const eyeState =
document.getElementById("eyeState");

const closedTime =
document.getElementById("closedTime");

const sirenState =
document.getElementById("sirenState");


let camera=null;
let running=false;

let eyesClosed=false;
let closedStart=0;

let siren=false;
let audioContext=null;
let sirenTimer=null;


/* =========================
   FACE MESH
========================= */

const faceMesh =
new FaceMesh({
  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
  }
});


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:.6,

  minTrackingConfidence:.6

});


faceMesh.onResults(results=>{

  if(!running) return;

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(
    !results.multiFaceLandmarks ||
    results.multiFaceLandmarks.length===0
  ){

    eyeState.textContent="NO FACE";

    status.textContent="FACE NOT DETECTED";

    status.className="status warning";

    stopSiren();

    return;

  }


  const landmarks =
    results.multiFaceLandmarks[0];


  /*
    LEFT EYE
    Approximate MediaPipe landmarks
  */

  const leftTop =
    landmarks[159];

  const leftBottom =
    landmarks[145];

  const leftLeft =
    landmarks[33];

  const leftRight =
    landmarks[133];


  /*
    RIGHT EYE
  */

  const rightTop =
    landmarks[386];

  const rightBottom =
    landmarks[374];

  const rightLeft =
    landmarks[362];

  const rightRight =
    landmarks[263];


  const leftVertical =
    distance(
      leftTop,
      leftBottom
    );

  const leftHorizontal =
    distance(
      leftLeft,
      leftRight
    );


  const rightVertical =
    distance(
      rightTop,
      rightBottom
    );

  const rightHorizontal =
    distance(
      rightLeft,
      rightRight
    );


  const leftRatio =
    leftVertical / leftHorizontal;

  const rightRatio =
    rightVertical / rightHorizontal;


  /*
    Eye aspect ratio threshold
  */

  const CLOSED_THRESHOLD=.18;

  const leftClosed =
    leftRatio < CLOSED_THRESHOLD;

  const rightClosed =
    rightRatio < CLOSED_THRESHOLD;


  const bothClosed =
    leftClosed && rightClosed;


  if(bothClosed){

    handleEyesClosed();

  }else{

    handleEyesOpen();

  }


  drawEyePoints(
    landmarks,
    [33,133,159,145,362,263,386,374]
  );

});


/* =========================
   DISTANCE
========================= */

function distance(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  return Math.sqrt(
    dx*dx+dy*dy
  );

}


/* =========================
   EYE CLOSED
========================= */

function handleEyesClosed(){

  if(!eyesClosed){

    eyesClosed=true;

    closedStart=
      Date.now();

  }


  const elapsed=
    (Date.now()-closedStart)/1000;


  closedTime.textContent=
    elapsed.toFixed(1)+" s";


  eyeState.textContent="CLOSED";


  if(elapsed < 2){

    status.textContent=
      "EYES CLOSED — WARNING";

    status.className=
      "status warning";

  }


  /*
    Siren after 2 seconds
  */

  if(elapsed >= 2){

    status.textContent=
      "⚠ EYES CLOSED — SIREN ACTIVE";

    status.className=
      "status danger";

    startSiren();

  }

}


/* =========================
   EYE OPEN
========================= */

function handleEyesOpen(){

  eyesClosed=false;

  closedStart=0;

  closedTime.textContent=
    "0.0 s";

  eyeState.textContent=
    "OPEN";

  status.textContent=
    "SYSTEM OK — EYES OPEN";

  status.className=
    "status";

  stopSiren();

}


/* =========================
   CAMERA
========================= */

async function startSystem(){

  if(running) return;

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user"
        },

        audio:false

      });


    video.srcObject=stream;

    await video.play();

    running=true;


    camera =
      new Camera(
        video,
        {

          onFrame:async()=>{

            await faceMesh.send({
              image:video
            });

          },

          width:640,

          height:480

        }
      );


    camera.start();


    status.textContent=
      "SYSTEM ACTIVE — LOOKING FOR EYES";

    status.className="status";


  }catch(error){

    console.error(error);

    status.textContent=
      "CAMERA PERMISSION REQUIRED";

    status.className=
      "status danger";

  }

}


/* =========================
   STOP
========================= */

function stopSystem(){

  running=false;

  stopSiren();

  if(video.srcObject){

    video.srcObject
      .getTracks()
      .forEach(track=>track.stop());

  }

  video.srcObject=null;

  eyeState.textContent="---";

  closedTime.textContent="0.0 s";

  status.textContent=
    "SYSTEM OFFLINE";

  status.className="status";

}


/* =========================
   SIREN
========================= */

function startSiren(){

  if(siren) return;

  siren=true;

  sirenState.textContent=
    "ON";


  /*
    Browser audio normally
    requires user interaction first.
  */

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(audioContext.state==="suspended"){

    audioContext.resume();

  }


  sirenTimer =
    setInterval(()=>{

      playSirenTone(700);

      setTimeout(()=>{
        playSirenTone(1100);
      },220);

    },500);

}


/* =========================
   SIREN TONE
========================= */

function playSirenTone(freq){

  if(!audioContext) return;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type="sawtooth";

  oscillator.frequency.value=
    freq;

  gain.gain.value=.08;


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime+.2
  );

}


/* =========================
   STOP SIREN
========================= */

function stopSiren(){

  if(!siren) return;

  siren=false;

  clearInterval(sirenTimer);

  sirenTimer=null;

  sirenState.textContent=
    "OFF";

}


/* =========================
   DRAW EYE POINTS
========================= */

function drawEyePoints(
  landmarks,
  indexes
){

  ctx.fillStyle=
    "#6eeaff";

  indexes.forEach(i=>{

    const p=
      landmarks[i];

    ctx.beginPath();

    ctx.arc(
      p.x*canvas.width,
      p.y*canvas.height,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

}

</script>

</body>
</html>
